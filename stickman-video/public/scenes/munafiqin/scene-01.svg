<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <!-- Scene 1: worried character, hand on head, big question mark -->
  <ellipse cx="470" cy="600" rx="170" ry="16" fill="#c9c9c9" opacity="0.6"/>
  <!-- head -->
  <circle cx="470" cy="180" r="66" fill="#ffffff" stroke="#111111" stroke-width="8"/>
  <!-- raised worried eyebrows -->
  <path d="M420 128 Q436 116 456 122" stroke="#111111" stroke-width="7" stroke-linecap="round"/>
  <path d="M484 120 Q504 112 520 124" stroke="#111111" stroke-width="7" stroke-linecap="round"/>
  <!-- big eyes -->
  <ellipse cx="446" cy="172" rx="17" ry="22" fill="#ffffff" stroke="#111111" stroke-width="6"/>
  <ellipse cx="494" cy="170" rx="19" ry="24" fill="#ffffff" stroke="#111111" stroke-width="6"/>
  <circle cx="450" cy="176" r="7" fill="#111111"/>
  <circle cx="498" cy="174" r="7.5" fill="#111111"/>
  <!-- small open mouth -->
  <circle cx="472" cy="216" r="11" fill="none" stroke="#111111" stroke-width="6"/>
  <!-- body -->
  <path d="M470 246 L470 420" stroke="#111111" stroke-width="16" stroke-linecap="round"/>
  <!-- left arm: hand scratching the top of the head -->
  <path d="M470 285 Q356 236 430 98" stroke="#111111" stroke-width="13" stroke-linecap="round"/>
  <circle cx="434" cy="92" r="12" fill="#111111"/>
  <!-- right arm: open, palm up -->
  <path d="M470 292 Q550 320 610 300" stroke="#111111" stroke-width="13" stroke-linecap="round"/>
  <circle cx="618" cy="297" r="12" fill="#111111"/>
  <!-- legs -->
  <path d="M470 420 Q446 500 424 570" stroke="#111111" stroke-width="14" stroke-linecap="round"/>
  <path d="M470 420 Q498 500 522 570" stroke="#111111" stroke-width="14" stroke-linecap="round"/>
  <path d="M424 572 L382 576" stroke="#111111" stroke-width="13" stroke-linecap="round"/>
  <path d="M522 572 L565 576" stroke="#111111" stroke-width="13" stroke-linecap="round"/>
  <!-- big question mark -->
  <path d="M760 250 Q760 180 830 180 Q900 180 900 250 Q900 305 830 320 L830 365" stroke="#111111" stroke-width="20" stroke-linecap="round"/>
  <circle cx="830" cy="420" r="14" fill="#111111"/>
  <!-- small floating question marks -->
  <path d="M955 140 Q955 112 983 112 Q1011 112 1011 140 Q1011 162 983 168 L983 186" stroke="#9a9a9a" stroke-width="10" stroke-linecap="round"/>
  <circle cx="983" cy="212" r="7" fill="#9a9a9a"/>
</svg>
