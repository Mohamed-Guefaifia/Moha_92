<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <!-- Scene 4: betraying the trust — holding a strongbox, shifty sideways look -->
  <ellipse cx="560" cy="600" rx="180" ry="16" fill="#c9c9c9" opacity="0.6"/>
  <!-- head -->
  <circle cx="560" cy="180" r="66" fill="#ffffff" stroke="#111111" stroke-width="8"/>
  <!-- uneasy eyebrows: one raised -->
  <path d="M508 138 L554 142" stroke="#111111" stroke-width="7" stroke-linecap="round"/>
  <path d="M574 128 Q598 118 618 130" stroke="#111111" stroke-width="7" stroke-linecap="round"/>
  <!-- eyes looking far to the side -->
  <ellipse cx="538" cy="176" rx="17" ry="22" fill="#ffffff" stroke="#111111" stroke-width="6"/>
  <ellipse cx="586" cy="174" rx="19" ry="24" fill="#ffffff" stroke="#111111" stroke-width="6"/>
  <circle cx="548" cy="180" r="7" fill="#111111"/>
  <circle cx="598" cy="178" r="7.5" fill="#111111"/>
  <!-- tight wavy mouth -->
  <path d="M534 222 Q548 214 562 222 Q576 230 590 220" stroke="#111111" stroke-width="6" stroke-linecap="round"/>
  <!-- body -->
  <path d="M560 246 L560 420" stroke="#111111" stroke-width="16" stroke-linecap="round"/>
  <!-- both arms holding the strongbox -->
  <path d="M560 285 Q470 310 415 355" stroke="#111111" stroke-width="13" stroke-linecap="round"/>
  <path d="M560 315 Q490 350 440 385" stroke="#111111" stroke-width="13" stroke-linecap="round"/>
  <!-- strongbox -->
  <g stroke="#111111" stroke-width="6">
    <rect x="280" y="330" width="170" height="110" rx="12" fill="#a8a8a8"/>
    <path d="M280 368 L450 368"/>
    <circle cx="365" cy="400" r="14" fill="#ffffff"/>
    <path d="M365 400 L365 418" stroke-width="7"/>
  </g>
  <circle cx="412" cy="352" r="12" fill="#111111"/>
  <circle cx="437" cy="382" r="12" fill="#111111"/>
  <!-- legs -->
  <path d="M560 420 Q538 500 518 570" stroke="#111111" stroke-width="14" stroke-linecap="round"/>
  <path d="M560 420 Q586 500 608 570" stroke="#111111" stroke-width="14" stroke-linecap="round"/>
  <path d="M518 572 L476 576" stroke="#111111" stroke-width="13" stroke-linecap="round"/>
  <path d="M608 572 L651 576" stroke="#111111" stroke-width="13" stroke-linecap="round"/>
  <!-- sweat drop -->
  <path d="M646 120 Q660 96 662 118 Q664 136 650 136 Q640 134 646 120 Z" fill="#a8a8a8"/>
</svg>
