<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الغضب وكيف يدمر حياتك</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 100vw; height: 100vh; overflow: hidden; background: #000; font-family: 'Cairo', sans-serif; }

/* ── Full-screen scene container ── */
#scene-wrap {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
}

/* ── Background gradient (changes per scene) ── */
#bg {
  position: absolute; inset: 0;
  transition: background 1.2s ease;
}

/* Scene gradients */
.bg-anger    { background: radial-gradient(ellipse at 60% 40%, #8B0000 0%, #3D0000 45%, #0D0000 100%); }
.bg-question { background: radial-gradient(ellipse at 40% 50%, #1A1A4E 0%, #0A0A28 50%, #050510 100%); }
.bg-hadith   { background: radial-gradient(ellipse at 50% 30%, #3D2800 0%, #1A1000 50%, #080500 100%); }
.bg-brain    { background: radial-gradient(ellipse at 50% 50%, #4A0020 0%, #1E000C 50%, #060003 100%); }
.bg-quran    { background: radial-gradient(ellipse at 50% 40%, #0D2B4A 0%, #051525 50%, #010810 100%); }
.bg-solution { background: radial-gradient(ellipse at 50% 60%, #0A2E1A 0%, #041510 50%, #010705 100%); }
.bg-love     { background: radial-gradient(ellipse at 50% 40%, #2A1A00 0%, #120C00 50%, #060300 100%); }
.bg-power    { background: radial-gradient(ellipse at 50% 30%, #0A0A0A 0%, #1A1200 40%, #0D0800 100%); }

/* ── Animated visual element per scene ── */
#visual {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}

/* Particle / glow effects */
.glow-red    { width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(circle, rgba(220,30,30,.35) 0%, transparent 70%); animation: pulse 2s ease-in-out infinite; }
.glow-gold   { width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(circle, rgba(255,215,0,.3) 0%, transparent 70%); animation: pulse 3s ease-in-out infinite; }
.glow-blue   { width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(circle, rgba(30,100,220,.3) 0%, transparent 70%); animation: pulse 2.5s ease-in-out infinite; }
.glow-green  { width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(circle, rgba(30,180,80,.25) 0%, transparent 70%); animation: pulse 2s ease-in-out infinite; }

@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: .7; }
  50%       { transform: scale(1.15); opacity: 1; }
}

/* ── Big scene icon (emoji/symbol) ── */
#scene-icon {
  position: absolute;
  font-size: clamp(80px, 12vw, 140px);
  opacity: .18;
  animation: float 4s ease-in-out infinite;
  pointer-events: none;
  user-select: none;
}
@keyframes float {
  0%, 100% { transform: translateY(0px) rotate(-3deg); }
  50%       { transform: translateY(-20px) rotate(3deg); }
}

/* ── Dark gradient overlay for text readability ── */
#overlay {
  position: absolute; inset: 0;
  background: linear-gradient(
    180deg,
    rgba(0,0,0,.4) 0%,
    rgba(0,0,0,.0) 30%,
    rgba(0,0,0,.0) 50%,
    rgba(0,0,0,.8) 100%
  );
}

/* ── Top scene label ── */
#scene-label {
  position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
  font-size: clamp(16px, 2.2vw, 24px); font-weight: 900; color: #FFD700;
  text-shadow: 0 2px 12px rgba(0,0,0,.9);
  opacity: 0; transition: opacity .4s ease;
  white-space: nowrap;
  background: rgba(0,0,0,.4); padding: 6px 18px; border-radius: 20px;
}

/* ── Subtitle bar ── */
#subtitle-wrap {
  position: absolute; bottom: 90px; left: 5%; right: 5%;
  text-align: center;
}
#subtitle {
  display: inline-block;
  font-size: clamp(20px, 2.8vw, 36px);
  font-weight: 800;
  color: #fff;
  text-shadow: 0 2px 8px rgba(0,0,0,.95), 0 0 20px rgba(0,0,0,.8);
  line-height: 1.6;
  background: rgba(0,0,0,.6);
  padding: 12px 28px;
  border-radius: 14px;
  border-right: 4px solid #FFD700;
  transition: opacity .25s ease;
  max-width: 920px;
}

/* ── Quran / Hadith highlight ── */
.quran-text {
  color: #FFD700 !important;
  font-size: clamp(22px, 3vw, 38px) !important;
  border-right-color: #FFD700 !important;
  background: rgba(5,5,25,.82) !important;
  box-shadow: 0 0 30px rgba(255,215,0,.15);
}

/* ── Progress bar ── */
#pbar {
  position: fixed; bottom: 0; left: 0; height: 5px;
  background: linear-gradient(90deg, #FFD700, #FFA500);
  transition: width .1s linear; z-index: 999;
}

/* ── Nav dots ── */
#nav {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 10px; z-index: 999;
}
.dot { height: 8px; border-radius: 4px; cursor: pointer;
  background: rgba(255,255,255,.25); transition: all .3s; }
.dot.active { background: #FFD700; }

/* ── Play overlay ── */
#play-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(5,5,20,.92); backdrop-filter: blur(8px);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 24px; cursor: pointer;
}
#play-btn {
  width: 110px; height: 110px; border-radius: 50%;
  background: linear-gradient(135deg, #FFD700, #FFA500);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 60px rgba(255,215,0,.45);
  transition: transform .2s;
}
#play-btn:hover { transform: scale(1.12); }
#play-btn::after {
  content: ''; width: 0; height: 0;
  border-top: 24px solid transparent; border-bottom: 24px solid transparent;
  border-left: 42px solid #1A1A1A; margin-right: -10px;
}
#play-title {
  font-size: clamp(20px, 3vw, 28px); font-weight: 900; color: #FFD700;
  text-align: center; line-height: 1.4;
}
#play-subtitle { font-size: 16px; color: rgba(255,255,255,.5); }

/* ── Optional: show uploaded image if exists ── */
#char-img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity .8s ease;
  animation: kenBurns 14s ease-in-out infinite alternate;
}
#char-img.loaded { opacity: .85; }
@keyframes kenBurns {
  from { transform: scale(1.0) translateX(0px); }
  to   { transform: scale(1.08) translateX(-18px); }
}
</style>
</head>
<body>

<!-- Play overlay -->
<div id="play-overlay">
  <div id="play-btn"></div>
  <div id="play-title">الغضب وكيف يدمر حياتك</div>
  <div id="play-subtitle">اضغط لتشغيل الفيديو مع الصوت</div>
</div>

<!-- Main scene -->
<div id="scene-wrap">
  <div id="bg" class="bg-anger"></div>
  <img id="char-img" src="" alt="">
  <div id="visual"><div class="glow-red"></div></div>
  <div id="scene-icon">😤</div>
  <div id="overlay"></div>
  <div id="scene-label"></div>
  <div id="subtitle-wrap"><div id="subtitle"></div></div>
</div>

<div id="pbar"></div>
<div id="nav"></div>

<audio id="vo" src="./voice.mp3" preload="auto"></audio>

<script>
// ── SCENES: bg class, icon, glow class, label, start time ──────────────────
const SCENES = [
  { bg:'bg-anger',    icon:'😤', glow:'glow-red',   label:'⚡ لحظة واحدة',          start:0  },
  { bg:'bg-question', icon:'❓', glow:'glow-blue',  label:'❓ الأسئلة',              start:5  },
  { bg:'bg-hadith',   icon:'📜', glow:'glow-gold',  label:'📜 الحديث الشريف',       start:15 },
  { bg:'bg-brain',    icon:'🧠', glow:'glow-red',   label:'🧠 اختطاف الدماغ',       start:24 },
  { bg:'bg-quran',    icon:'✨', glow:'glow-gold',  label:'✨ الآية الكريمة',        start:34 },
  { bg:'bg-solution', icon:'💧', glow:'glow-green', label:'💧 الحل في 4 خطوات',     start:44 },
  { bg:'bg-love',     icon:'💛', glow:'glow-gold',  label:'💛 الله يُحب الكاظمين',  start:62 },
  { bg:'bg-power',    icon:'👑', glow:'glow-gold',  label:'👑 القوة الحقيقية',      start:68 },
];

// ── SUBTITLES ──────────────────────────────────────────────────────────────
const SUBS = [
  { s:0,   e:5,   t:'لحظة غضب واحدة تدمر ما بنيته في سنين.' },
  { s:5,   e:10,  t:'هل سبق أن قلت كلاماً في لحظة غضب وندمت عليه؟' },
  { s:10,  e:15,  t:'هل الغضب قوة أم ضعف؟ ولماذا أمرنا الإسلام بكظم الغيظ؟' },
  { s:15,  e:20,  t:'قال النبي ﷺ:', style:'quran' },
  { s:20,  e:24,  t:'"ليس الشديد بالصُّرَعة، إنما الشديد الذي يملك نفسه عند الغضب."', style:'quran' },
  { s:24,  e:29,  t:'حين تغضب، دماغك يُختطف — يتوقف التفكير ويبدأ التدمير.' },
  { s:29,  e:34,  t:'كلمة واحدة في لحظة الغضب قد تنهي علاقة بنيتها سنين.' },
  { s:34,  e:38,  t:'قال الله تعالى:', style:'quran' },
  { s:38,  e:44,  t:'﴿ وَالْكَاظِمِينَ الْغَيْظَ وَالْعَافِينَ عَنِ النَّاسِ وَاللَّهُ يُحِبُّ الْمُحْسِنِينَ ﴾', style:'quran' },
  { s:44,  e:48,  t:'حين تغضب افعل أربعة أشياء:' },
  { s:48,  e:52,  t:'① قل "أعوذ بالله من الشيطان الرجيم".' },
  { s:52,  e:56,  t:'② اصمت — الكلام في الغضب جُرح لا يُنسى.' },
  { s:56,  e:60,  t:'③ غيّر وضعيتك — إن كنت قائماً فاجلس.' },
  { s:60,  e:62,  t:'④ توضأ — "إنما تُطفأ النار بالماء."', style:'quran' },
  { s:62,  e:68,  t:'الله يُحب من يكظم غيظه. كظم الغيظ ليس ضعفاً — ولهذا أحبّه الله.' },
  { s:68,  e:72,  t:'القوة الحقيقية هي الصمت في لحظة الغضب.' },
  { s:72,  e:76,  t:'ابدأ الآن.' },
];

const TOTAL = 76;

// ── DOM refs ──────────────────────────────────────────────────────────────
const vo        = document.getElementById('vo');
const bgEl      = document.getElementById('bg');
const charImg   = document.getElementById('char-img');
const visualEl  = document.getElementById('visual');
const iconEl    = document.getElementById('scene-icon');
const subEl     = document.getElementById('subtitle');
const labelEl   = document.getElementById('scene-label');
const pbar      = document.getElementById('pbar');
const nav       = document.getElementById('nav');
const playOv    = document.getElementById('play-overlay');

// ── Optional images (placed in same folder as this file) ──────────────────
// If you add image files, name them: img1.jpg, img2.jpg ... img5.jpg
// Scene → image mapping
const IMG_MAP = [
  './img1.jpg',  // scenes 0 (anger hook)
  './img2.jpg',  // scene 1 (question)
  './img3.jpg',  // scenes 2,4 (hadith, quran)
  './img4.jpg',  // scenes 5,6 (solution, love)
  './img5.jpg',  // scenes 3,7 (brain, power)
];
const SCENE_IMG = [0, 1, 2, 4, 2, 3, 3, 4];

// Try loading images silently — if they exist, show them
function tryLoadImg(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload  = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = src;
  });
}

// ── Build nav dots ────────────────────────────────────────────────────────
let curScene = 0;
function buildNav() {
  nav.innerHTML = '';
  SCENES.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === curScene ? ' active' : '');
    d.style.width = i === curScene ? '26px' : '10px';
    d.onclick = () => { vo.currentTime = SCENES[i].start; if (vo.paused) vo.play(); };
    nav.appendChild(d);
  });
}

// ── Update scene ──────────────────────────────────────────────────────────
let lastSceneIdx = -1;
function updateScene(idx) {
  if (idx === lastSceneIdx) return;
  lastSceneIdx = idx;
  curScene = idx;
  const sc = SCENES[idx];

  // Background
  bgEl.className = sc.bg;

  // Glow
  visualEl.innerHTML = `<div class="${sc.glow}"></div>`;

  // Icon
  iconEl.textContent = sc.icon;

  // Label
  labelEl.textContent = sc.label;
  labelEl.style.opacity = '1';

  // Optional image
  const imgSrc = IMG_MAP[SCENE_IMG[idx]];
  charImg.classList.remove('loaded');
  tryLoadImg(imgSrc).then(ok => {
    if (ok) {
      charImg.src = imgSrc;
      charImg.classList.add('loaded');
    } else {
      charImg.src = '';
      charImg.classList.remove('loaded');
    }
  });

  buildNav();
}

// ── Update subtitle ───────────────────────────────────────────────────────
let lastSubIdx = -1;
function updateSub(t) {
  let idx = -1;
  for (let i = 0; i < SUBS.length; i++) {
    if (t >= SUBS[i].s && t < SUBS[i].e) { idx = i; break; }
  }
  if (idx === lastSubIdx) return;
  lastSubIdx = idx;

  if (idx === -1) { subEl.style.opacity = '0'; return; }

  const sub = SUBS[idx];
  subEl.style.opacity = '0';
  setTimeout(() => {
    subEl.textContent = sub.t;
    subEl.className = sub.style === 'quran' ? 'quran-text' : '';
    subEl.style.opacity = '1';
  }, 120);
}

// ── Timeupdate loop ───────────────────────────────────────────────────────
vo.addEventListener('timeupdate', () => {
  const t = vo.currentTime;
  pbar.style.width = Math.min(t / TOTAL * 100, 100) + '%';

  let sIdx = SCENES.length - 1;
  for (let i = 0; i < SCENES.length - 1; i++) {
    if (t < SCENES[i + 1].start) { sIdx = i; break; }
  }
  updateScene(sIdx);
  updateSub(t);
});

vo.addEventListener('ended', () => { pbar.style.width = '100%'; });

// ── Play button ───────────────────────────────────────────────────────────
playOv.addEventListener('click', () => {
  playOv.style.display = 'none';
  updateScene(0);
  updateSub(0);
  vo.play().catch(() => {});
});

// ── Keyboard navigation ───────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') {
    e.preventDefault();
    const next = Math.min(curScene + 1, SCENES.length - 1);
    vo.currentTime = SCENES[next].start;
    if (vo.paused) vo.play();
  }
  if (e.key === 'ArrowLeft') {
    const prev = Math.max(curScene - 1, 0);
    vo.currentTime = SCENES[prev].start;
    if (vo.paused) vo.play();
  }
  if (e.key === 'k' || e.key === 'K') {
    vo.paused ? vo.play() : vo.pause();
  }
});

// ── Init ──────────────────────────────────────────────────────────────────
updateScene(0);
buildNav();
</script>
</body>
</html>
