<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الغضب وكيف يدمر حياتك</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 100vw; height: 100vh; overflow: hidden; font-family: 'Cairo', sans-serif; }

@keyframes fadeIn    { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeInUp  { from{opacity:0;transform:translateY(40px)} to{opacity:1;transform:translateY(0)} }
@keyframes float     { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
@keyframes floatSlow { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
@keyframes pulse     { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
@keyframes shake     { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
@keyframes shakeRot  { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-6deg)} 75%{transform:rotate(6deg)} }
@keyframes grow      { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }
@keyframes crumble   { 0%{transform:translateY(0) rotate(0);opacity:1} 100%{transform:translateY(60px) rotate(25deg);opacity:0} }
@keyframes slideIn   { from{transform:translateX(-80px);opacity:0} to{transform:translateX(0);opacity:1} }
@keyframes slideUp   { from{transform:translateY(50px);opacity:0} to{transform:translateY(0);opacity:1} }
@keyframes writeIn   { from{clip-path:inset(0 100% 0 0)} to{clip-path:inset(0 0% 0 0)} }
@keyframes flameWave { 0%,100%{transform:scaleY(1) skewX(0)} 50%{transform:scaleY(1.15) skewX(-4deg)} }
@keyframes waterFall { from{transform:translateY(-30px);opacity:0} to{transform:translateY(0);opacity:1} }
@keyframes extinguish{ from{transform:scale(1);opacity:1} to{transform:scale(0);opacity:0} }
@keyframes glowPulse { 0%,100%{filter:drop-shadow(0 0 6px #FFD700)} 50%{filter:drop-shadow(0 0 20px #FFD700)} }
@keyframes heartDrop { from{transform:translateY(-80px);opacity:0} to{transform:translateY(0);opacity:1} }
@keyframes sunRise   { from{transform:translateY(60px);opacity:0} to{transform:translateY(0);opacity:1} }
@keyframes sceneFade { from{opacity:0} to{opacity:1} }
@keyframes arrowFly  { from{transform:translateX(-20px);opacity:0} to{transform:translateX(60px);opacity:0} }
@keyframes runAway   { from{transform:translateX(0);opacity:1} to{transform:translateX(120px);opacity:0} }
@keyframes vanish    { 0%{opacity:1;transform:scale(1)} 100%{opacity:0;transform:scale(0)} }

.scene { position:absolute; inset:0; animation: sceneFade .5s ease both; }
.title {
  position:absolute; top:30px; left:50%; transform:translateX(-50%);
  font-size:clamp(34px,4.5vw,58px); font-weight:900; white-space:nowrap;
  text-shadow:3px 3px 0 rgba(0,0,0,.18); animation: fadeIn .7s ease both;
}
.sub {
  position:absolute; bottom:55px; left:50%; transform:translateX(-50%);
  font-size:clamp(16px,2vw,26px); font-weight:700;
  background:rgba(255,255,255,.9); padding:10px 30px;
  border-radius:40px; white-space:nowrap;
  box-shadow:0 4px 18px rgba(0,0,0,.14);
  animation: fadeIn .6s ease .4s both;
}
#nav {
  position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
  display:flex; gap:9px; z-index:999;
}
.dot { height:9px; border-radius:5px; cursor:pointer; background:rgba(0,0,0,.25); transition:all .3s; }
.dot.active { background:#1A1A1A; }
#counter {
  position:fixed; top:12px; right:16px; z-index:999;
  background:rgba(0,0,0,.5); color:#fff;
  padding:5px 16px; border-radius:20px; font-size:15px; font-weight:700;
}
#pbar { position:fixed; bottom:0; left:0; height:4px; background:#FFD700; transition:width .1s linear; z-index:999; }
</style>
</head>
<body>
<div id="counter"></div>
<div id="nav"></div>
<div id="pbar"></div>
<div id="stage"></div>

// ─── 6. FIRE EXTINGUISHED — 4 SOLUTIONS ──────────────────────────────────────
{label:'الحل في 4 خطوات', dur:6000, render:()=>`
<div class="scene" style="background:#FFE566">

      <polygon points="730,320 710,380 750,370 720,430 760,400 740,450 760,440 730,480"
        fill="#FF4444" opacity=".9"/>
      <polygon points="730,330 715,380 740,375 720,420 750,405 738,440 756,430 730,470"

// ─── Audio-driven Engine ─────────────────────────────────────────────────────
// Scene start times (seconds) — matched to voiceover timing
const STARTS = [0, 5, 15, 24, 34, 44, 62, 68];
const TOTAL  = 70; // approx audio duration in seconds

let cur = 0;
const stage = document.getElementById('stage');
const nav   = document.getElementById('nav');
const ctr   = document.getElementById('counter');
const bar   = document.getElementById('pbar');

// Create audio element
const audio = document.createElement('audio');
audio.src = './voice.mp3';
audio.preload = 'auto';
document.body.appendChild(audio);

// Play button overlay
const playBtn = document.createElement('div');
playBtn.id = 'play-overlay';
playBtn.innerHTML = `
  <div style="display:flex;flex-direction:column;align-items:center;gap:16px">
    <div style="width:90px;height:90px;border-radius:50%;background:#FFD700;
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 0 40px rgba(255,215,0,.6);cursor:pointer">
      <div style="width:0;height:0;border-top:20px solid transparent;
        border-bottom:20px solid transparent;border-left:34px solid #1A1A1A;
        margin-right:-6px"></div>
    </div>
    <div style="color:#FFD700;font-size:24px;font-weight:800;font-family:Cairo,sans-serif">
      اضغط للتشغيل مع الصوت
    </div>
  </div>`;
Object.assign(playBtn.style, {
  position:'fixed', inset:'0', zIndex:'9999',
  background:'rgba(10,10,30,.82)', display:'flex',
  alignItems:'center', justifyContent:'center', cursor:'pointer',
  backdropFilter:'blur(4px)'
});
document.body.appendChild(playBtn);

function buildNav() {
  nav.innerHTML = '';
  SCENES.forEach((_,i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i===cur?' active':'');
    d.style.width = i===cur ? '26px':'10px';
    d.onclick = () => { audio.currentTime = STARTS[i]; };
    nav.appendChild(d);
  });
}

function render(idx) {
  if (idx === cur && stage.innerHTML) return;
  cur = idx;
  stage.innerHTML = SCENES[cur].render();
  ctr.textContent = SCENES[cur].label + ' — ' + (cur+1) + '/' + SCENES.length;
  buildNav();
}

// Drive scenes from audio time
audio.addEventListener('timeupdate', () => {
  const t = audio.currentTime;
  // Progress bar
  bar.style.width = Math.min(t / TOTAL * 100, 100) + '%';
  // Find current scene
  let idx = STARTS.length - 1;
  for (let i = 0; i < STARTS.length - 1; i++) {
    if (t < STARTS[i+1]) { idx = i; break; }
  }
  render(idx);
});

audio.addEventListener('ended', () => { bar.style.width = '100%'; });

// Start on click
playBtn.addEventListener('click', () => {
  playBtn.remove();
  audio.play();
  render(0);
});

// Show first scene immediately (silent preview)
render(0);

// Keyboard controls
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') {
    audio.currentTime = STARTS[Math.min(cur+1, STARTS.length-1)];
    if (audio.paused) audio.play();
  }
  if (e.key === 'ArrowLeft') {
    audio.currentTime = STARTS[Math.max(cur-1, 0)];
    if (audio.paused) audio.play();
  }
});
</script>
